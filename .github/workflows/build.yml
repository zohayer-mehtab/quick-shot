name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show files
        run: ls -la
      - name: Unzip project
        run: unzip -q -o "$(find . -maxdepth 2 -name '*.zip' | head -n 1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        run: |
          cd "$(dirname "$(find . -name settings.gradle.kts | head -n 1)")"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QuickShot-apk
          path: "**/app-debug.apk"
